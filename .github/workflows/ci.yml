# ZAMROŻONE (krok 0). Testy + kontrola własności plików na każdym PR.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' -r requirements-core.txt -r requirements-assistant.txt
      - name: Kontrola własności plików
        if: github.event_name == 'pull_request'
        run: python scripts/check_ownership.py --branch "${{ github.head_ref }}" --base "origin/${{ github.base_ref }}"
      - run: pytest
